<style>
/* ==========================================================================
   01. TOKENS

/* ==========================================================================
   02. RESET & BASE

  padding: var(--space-3); margin-block: var(--space-3);
  white-space: pre-wrap; overflow-x: auto;
}

/* ==========================================================================
   05. RECETTES (unités de méthode)
   ========================================================================== */
.recette {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: var(--space-4); box-shadow: var(--shadow);
}
.recette + .recette { margin-block-start: var(--space-3); }
.recette__tag {
  display: inline-block; font-family: var(--font-mono); font-size: var(--fs-xs);
  text-transform: uppercase; letter-spacing: 0.07em;

  counter-increment: step; content: counter(step);

  width: 1.35rem; height: 1.35rem; display: grid; place-items: center;

  font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600;
}

/* ==========================================================================
   06. QUIZ & BOUTONS
   ========================================================================== */

  display: flex; align-items: flex-start; gap: var(--space-3); text-align: start;
  width: 100%; min-height: 44px; cursor: pointer;

  padding: var(--space-3); font-family: var(--font-body); font-size: var(--fs-sm); color: var(--ink);

}

  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);

  border: 1px solid var(--accent); border-radius: var(--radius-sm);
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
  cursor: pointer; transition: filter 0.2s, transform 0.2s, border-color 0.2s, color 0.2s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(1px); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn--ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }

/* ==========================================================================
   07. CHRONOMÈTRE
   ========================================================================== */
.timer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); box-shadow: var(--shadow); }

.timer__hint { font-size: var(--fs-sm); color: var(--muted); margin-block: var(--space-2) var(--space-3); min-height: 1.4em; }

/* ==========================================================================
   08. FOCUS MODE
   ========================================================================== */
body.is-focus .panel { display: none !important; }
body.is-focus #focus-view { display: block !important; }
